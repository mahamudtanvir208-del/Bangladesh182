<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetic Strings & Drums</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0f14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .hud {
      position: fixed;
      top: 20px;
      left: 24px;
      display: flex;
      gap: 10px;
      z-index: 10;
      align-items: center;
    }
    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #cbd5e1;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }
    .hint {
      position: fixed;
      top: 26px;
      right: 28px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.04em;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="hud">
    <button class="btn" id="spawnOrbBtn">+ Launch Kinetic Orb</button>
    <button class="btn" id="clearOrbsBtn">Clear Orbs</button>
    <button class="btn" id="clearStaffBtn">Clear Sheet</button>
  </div>
  <div class="hint">Swipe strings & shapes • Double-click space to spawn an orb</div>

  <canvas id="appCanvas"></canvas>

  <script>
    const canvas = document.getElementById('appCanvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    // --- WEB AUDIO SYNTHESIS ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playGuitarNote(freq) {
      initAudio();
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq * 1.002, now); // Slight detune for warmth

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(freq * 6, now);
      filter.frequency.exponentialRampToValueAtTime(freq * 1.2, now + 1.4);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.28, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.8);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 1.85);
      osc2.stop(now + 1.85);
    }

    function playDrumSound(type) {
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'kick') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.14);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.46);
      } else if (type === 'snare') {
        // Noise burst
        const bufferSize = audioCtx.sampleRate * 0.2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(350, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);

        // Body snap
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
        oscGain.gain.setValueAtTime(0.4, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      } else if (type === 'hihat') {
        const bufferSize = audioCtx.sampleRate * 0.09;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(6500, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      } else if (type === 'tom') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(210, now);
        osc.frequency.exponentialRampToValueAtTime(85, now + 0.25);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.31);
      }
    }

    // --- MUSICAL DEFINITIONS & LAYOUT ---
    // Staff step: 0 = Bottom line (E4), negative = below E4, positive = higher lines/spaces
    const guitarDefs = [
      { label: 'E2', freq: 82.41,  color: '#38bdf8', staffStep: -7 },
      { label: 'A2', freq: 110.00, color: '#60a5fa', staffStep: -4 },
      { label: 'D3', freq: 146.83, color: '#818cf8', staffStep: -1 },
      { label: 'G3', freq: 196.00, color: '#a78bfa', staffStep: 2 },
      { label: 'B3', freq: 246.94, color: '#c084fc', staffStep: 4 },
      { label: 'E4', freq: 329.63, color: '#e879f9', staffStep: 7 }
    ];

    const drumDefs = [
      { id: 'kick',  label: 'KICK',   shape: 'circle',   color: '#f43f5e', staffStep: 0, isDrum: true },
      { id: 'snare', label: 'SNARE',  shape: 'hexagon',  color: '#fb923c', staffStep: 4, isDrum: true },
      { id: 'tom',   label: 'TOM',    shape: 'diamond',  color: '#facc15', staffStep: 6, isDrum: true },
      { id: 'hihat', label: 'HI-HAT', shape: 'triangle', color: '#4ade80', staffStep: 9, isDrum: true }
    ];

    let strings = [];
    let drums = [];
    let orbs = [];
    let ripples = [];
    let sheetNotes = [];

    function setupLayout() {
      const playBottom = height * 0.72;
      const stringTop = height * 0.12;
      const stringBottom = playBottom - 30;

      // Setup 6 Guitar Strings on the left half
      const startX = width * 0.12;
      const endX = width * 0.44;
      const spacing = (endX - startX) / (guitarDefs.length - 1);

      strings = guitarDefs.map((def, i) => ({
        ...def,
        x: startX + i * spacing,
        y1: stringTop,
        y2: stringBottom,
        amp: 0,
        vel: 0,
        cooldown: 0
      }));

      // Setup 4 Drum Shapes on the right half
      const drumCenterX = width * 0.72;
      const drumCenterY = (stringTop + stringBottom) * 0.5;
      const spreadX = Math.min(width * 0.12, 130);
      const spreadY = Math.min(height * 0.14, 110);

      const offsets = [
        { dx: -spreadX, dy: spreadY },  // Kick
        { dx: -spreadX, dy: -spreadY }, // Snare
        { dx: spreadX,  dy: spreadY },  // Tom
        { dx: spreadX,  dy: -spreadY }  // Hi-hat
      ];

      drums = drumDefs.map((def, i) => ({
        ...def,
        x: drumCenterX + offsets[i].dx,
        y: drumCenterY + offsets[i].dy,
        radius: Math.min(width, height) * 0.068,
        scale: 1,
        cooldown: 0
      }));
    }

    setupLayout();

    // --- SPAWN INITIAL KINETIC ORBS ---
    function spawnOrb(customX, customY) {
      const playBottom = height * 0.72;
      const angle = Math.random() * Math.PI * 2;
      const speed = 3.2 + Math.random() * 2.2;
      orbs.push({
        x: customX ?? (width * 0.25 + Math.random() * width * 0.5),
        y: customY ?? (height * 0.2 + Math.random() * (playBottom - height * 0.3)),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 9,
        trail: []
      });
    }

    // Start with 2 kinetic orbs so the app feels alive immediately
    spawnOrb(width * 0.28, height * 0.38);
    spawnOrb(width * 0.65, height * 0.34);

    // --- TRIGGER & SHEET NOTATION ---
    function addSheetNote(item) {
      sheetNotes.push({
        label: item.label,
        color: item.color,
        staffStep: item.staffStep,
        isDrum: !!item.isDrum,
        x: width - 90,
        alpha: 1,
        birth: performance.now()
      });
      if (sheetNotes.length > 60) {
        sheetNotes.shift();
      }
    }

    function triggerString(s, pluckY, speed = 1) {
      if (s.cooldown > 0) return;
      s.amp = Math.min(28, Math.max(12, speed * 2.5));
      s.cooldown = 10;
      playGuitarNote(s.freq);
      addSheetNote(s);
      ripples.push({ x: s.x, y: pluckY, r: 4, maxR: 42, color: s.color, alpha: 0.9 });
    }

    function triggerDrum(d) {
      if (d.cooldown > 0) return;
      d.scale = 1.28;
      d.cooldown = 12;
      playDrumSound(d.id);
      addSheetNote(d);
      ripples.push({ x: d.x, y: d.y, r: d.radius * 0.8, maxR: d.radius * 1.9, color: d.color, alpha: 0.85 });
    }

    // --- POINTER / MOUSE INTERACTION ---
    let pointer = { x: null, y: null, px: null, py: null };

    function checkLineCrossing(x1, y1, x2, y2, s) {
      if (x1 === null || x2 === null) return false;
      const minY = s.y1;
      const maxY = s.y2;
      if ((y1 < minY && y2 < minY) || (y1 > maxY && y2 > maxY)) return false;
      return (x1 < s.x && x2 >= s.x) || (x1 > s.x && x2 <= s.x);
    }

    window.addEventListener('pointermove', (e) => {
      pointer.px = pointer.x;
      pointer.py = pointer.y;
      pointer.x = e.clientX;
      pointer.y = e.clientY;

      if (pointer.px !== null) {
        const moveSpeed = Math.hypot(pointer.x - pointer.px, pointer.y - pointer.py);

        // Check string plucks
        strings.forEach(s => {
          if (checkLineCrossing(pointer.px, pointer.py, pointer.x, pointer.y, s)) {
            triggerString(s, pointer.y, moveSpeed);
          }
        });

        // Check drum shape passes
        drums.forEach(d => {
          const prevDist = Math.hypot(pointer.px - d.x, pointer.py - d.y);
          const currDist = Math.hypot(pointer.x - d.x, pointer.y - d.y);
          if (prevDist > d.radius && currDist <= d.radius) {
            triggerDrum(d);
          }
        });
      }
    });

    window.addEventListener('pointerdown', (e) => {
      initAudio();
      const x = e.clientX;
      const y = e.clientY;

      // Tap directly on drum pad
      drums.forEach(d => {
        if (Math.hypot(x - d.x, y - d.y) <= d.radius) {
          triggerDrum(d);
        }
      });

      // Tap near a guitar string
      strings.forEach(s => {
        if (Math.abs(x - s.x) < 16 && y >= s.y1 && y <= s.y2) {
          triggerString(s, y, 10);
        }
      });
    });

    window.addEventListener('dblclick', (e) => {
      if (e.clientY < height * 0.72) {
        spawnOrb(e.clientX, e.clientY);
      }
    });

    // Buttons
    document.getElementById('spawnOrbBtn').addEventListener('click', () => {
      initAudio();
      spawnOrb();
    });
    document.getElementById('clearOrbsBtn').addEventListener('click', () => {
      orbs = [];
    });
    document.getElementById('clearStaffBtn').addEventListener('click', () => {
      sheetNotes = [];
    });

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      setupLayout();
    });

    // --- DRAWING HELPERS ---
    function drawPolygon(cx, cy, radius, sides, rotation = 0) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const a = rotation + (i * 2 * Math.PI) / sides;
        const x = cx + Math.cos(a) * radius;
        const y = cy + Math.sin(a) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    // --- MAIN ANIMATION LOOP ---
    function animate() {
      ctx.clearRect(0, 0, width, height);

      const playBottom = height * 0.72;

      // 1. Update & Draw Guitar Strings
      strings.forEach(s => {
        if (s.cooldown > 0) s.cooldown--;

        // Damped harmonic vibration
        const force = -0.35 * s.amp;
        s.vel = (s.vel + force) * 0.88;
        s.amp += s.vel;
        if (Math.abs(s.amp) < 0.05) s.amp = 0;

        // Endpoints
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.arc(s.x, s.y1, 3.5, 0, Math.PI * 2);
        ctx.arc(s.x, s.y2, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Vibrating curve
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(s.x, s.y1);
        ctx.quadraticCurveTo(s.x + s.amp, (s.y1 + s.y2) / 2, s.x, s.y2);
        ctx.strokeStyle = Math.abs(s.amp) > 1 ? s.color : 'rgba(226, 232, 240, 0.35)';
        ctx.lineWidth = Math.abs(s.amp) > 1 ? 3 : 1.6;
        if (Math.abs(s.amp) > 1) {
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 14;
        }
        ctx.stroke();
        ctx.restore();

        // String Note Label
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '600 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(s.label, s.x, s.y2 + 22);
      });

      // 2. Update & Draw Drum Shapes
      drums.forEach(d => {
        if (d.cooldown > 0) d.cooldown--;
        d.scale += (1 - d.scale) * 0.16;

        const r = d.radius * d.scale;
        ctx.save();
        ctx.strokeStyle = d.color;
        ctx.fillStyle = d.scale > 1.03 ? `${d.color}33` : `${d.color}14`;
        ctx.lineWidth = 2.5;
        if (d.scale > 1.03) {
          ctx.shadowColor = d.color;
          ctx.shadowBlur = 20;
        }

        if (d.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
        } else if (d.shape === 'hexagon') {
          drawPolygon(d.x, d.y, r, 6, Math.PI / 6);
        } else if (d.shape === 'diamond') {
          drawPolygon(d.x, d.y, r, 4, 0);
        } else if (d.shape === 'triangle') {
          drawPolygon(d.x, d.y, r, 3, -Math.PI / 2);
        }

        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Drum Label
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.font = '600 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(d.label, d.x, d.y);
      });

      // 3. Update & Draw Kinetic Orbs
      orbs.forEach(orb => {
        const px = orb.x;
        const py = orb.y;

        orb.x += orb.vx;
        orb.y += orb.vy;

        // Bounce off walls & staff divider
        if (orb.x < orb.r || orb.x > width - orb.r) orb.vx *= -1;
        if (orb.y < 60 + orb.r || orb.y > playBottom - orb.r) orb.vy *= -1;

        // Check orb crossing guitar strings
        strings.forEach(s => {
          if (checkLineCrossing(px, py, orb.x, orb.y, s)) {
            triggerString(s, orb.y, Math.hypot(orb.vx, orb.vy) * 3);
          }
        });

        // Check orb colliding with or passing drum shapes
        drums.forEach(d => {
          const dist = Math.hypot(orb.x - d.x, orb.y - d.y);
          if (dist < d.radius + orb.r) {
            triggerDrum(d);
            // Deflect orb smoothly outward
            const nx = (orb.x - d.x) / (dist || 1);
            const ny = (orb.y - d.y) / (dist || 1);
            const speed = Math.hypot(orb.vx, orb.vy);
            orb.vx = nx * speed;
            orb.vy = ny * speed;
            orb.x = d.x + nx * (d.radius + orb.r + 2);
            orb.y = d.y + ny * (d.radius + orb.r + 2);
          }
        });

        // Trail
        orb.trail.push({ x: orb.x, y: orb.y });
        if (orb.trail.length > 14) orb.trail.shift();

        ctx.beginPath();
        orb.trail.forEach((pt, idx) => {
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Orb head
        ctx.save();
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.restore();
      });

      // 4. Draw Ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += 1.8;
        rp.alpha -= 0.03;
        if (rp.alpha <= 0) {
          ripples.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.strokeStyle = rp.color;
        ctx.globalAlpha = rp.alpha;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // 5. Draw Live Sheet Music Staff at Bottom
      const staffTop = height * 0.78;
      const lineSpacing = 12;
      const bottomLineY = staffTop + lineSpacing * 4;

      // Subtle background panel for sheet music
      ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
      ctx.fillRect(0, playBottom, width, height - playBottom);

      // 5 Horizontal Staff Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        const y = staffTop + i * lineSpacing;
        ctx.beginPath();
        ctx.moveTo(40, y);
        ctx.lineTo(width - 40, y);
        ctx.stroke();
      }

      // Treble/Percussion Clef Symbol
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.font = '38px serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('𝄞', 50, staffTop + lineSpacing * 2);

      // Scroll & Render Plucked/Struck Notes
      for (let i = sheetNotes.length - 1; i >= 0; i--) {
        const n = sheetNotes[i];
        n.x -= 1.6; // Scroll left like a live ticker

        if (n.x < 95) {
          n.alpha -= 0.05;
        }
        if (n.alpha <= 0) {
          sheetNotes.splice(i, 1);
          continue;
        }

        // Convert staffStep to Y position
        const noteY = bottomLineY - n.staffStep * (lineSpacing / 2);

        ctx.save();
        ctx.globalAlpha = Math.max(0, n.alpha);
        ctx.strokeStyle = n.color;
        ctx.fillStyle = n.color;

        // Ledger lines for lower guitar strings (below E4)
        if (n.staffStep <= -2) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
          ctx.lineWidth = 1;
          for (let step = -2; step >= n.staffStep; step -= 2) {
            const ly = bottomLineY - step * (lineSpacing / 2);
            ctx.beginPath();
            ctx.moveTo(n.x - 10, ly);
            ctx.lineTo(n.x + 10, ly);
            ctx.stroke();
          }
          ctx.strokeStyle = n.color;
        }

        if (n.isDrum) {
          // Percussion X-notehead
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(n.x - 5, noteY - 5);
          ctx.lineTo(n.x + 5, noteY + 5);
          ctx.moveTo(n.x + 5, noteY - 5);
          ctx.lineTo(n.x - 5, noteY + 5);
          ctx.stroke();
        } else {
          // Tilted oval notehead for guitar
          ctx.beginPath();
          ctx.ellipse(n.x, noteY, 6.5, 4.5, -0.35, 0, Math.PI * 2);
          ctx.fill();
        }

        // Note Stem
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(n.x + 5.5, noteY);
        ctx.lineTo(n.x + 5.5, noteY - 26);
        ctx.stroke();

        // Subtle note label underneath or above
        ctx.font = '600 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.fillText(n.label, n.x, bottomLineY + 46);

        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
